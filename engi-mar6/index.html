<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thai Consonant Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Start Screen -->
    <section id="start-screen" class="card">
      <h1>Thai Consonants</h1>
      <p class="subtitle">Enter your nickname to start the quiz</p>

      <input
        id="nickname-input"
        type="text"
        placeholder="Enter your nickname"
        maxlength="30"
        autocomplete="off"
      />

      <button id="start-btn" class="primary-btn">Start Quiz</button>
      <p id="start-error" class="error-text"></p>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="card hidden">
      <div class="top-bar">
        <div>
          <div id="player-line" class="player-line">Player</div>
          <div id="meta-line" class="meta-line">Starts: 0</div>
        </div>

        <div class="quiz-stats">
          <span id="lives">❤️❤️❤️</span>
          <span id="remaining">Remaining: 44</span>
        </div>
      </div>

      <h2>Thai Consonant Drill</h2>

      <div id="thai-char" class="thai-char">ก</div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback"></div>

      <div class="actions">
        <button id="next-btn" class="secondary-btn hidden">Next</button>
        <button id="restart-btn" class="secondary-btn hidden">Restart</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
